name: CycleQuant daily evaluation

on:
  schedule:
    - cron: "23 * * * *" # Refresh the public paper mirror hourly.
    - cron: "37 6 * * *" # Primary daily decision.
    - cron: "47 8 * * *" # Recovery run; the decision is idempotent.
  workflow_dispatch:
    inputs:
      mode:
        description: "Run the daily evaluator or only verify and mirror the paper broker"
        required: true
        default: daily
        type: choice
        options:
          - daily
          - sync-broker

concurrency:
  group: cyclequant-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CQ_ENVIRONMENT: production
      CQ_DATABASE_BACKEND: supabase
      CQ_BROKER_MODE: ${{ vars.CYCLEQUANT_BROKER_MODE || 'simulated' }}
      CQ_TRADING_ENABLED: ${{ vars.CYCLEQUANT_TRADING_ENABLED || 'false' }}
      CQ_NEWS_ANALYZER: ${{ vars.CYCLEQUANT_NEWS_ANALYZER || 'heuristic' }}
      CQ_RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || github.event.schedule == '23 * * * *' && 'sync-broker' || 'daily' }}
      CQ_LOG_JSON: "true"
      SUPABASE_URL: ${{ secrets.CYCLEQUANT_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CYCLEQUANT_SUPABASE_PUBLISHABLE_KEY }}
      CYCLEQUANT_WRITE_TOKEN: ${{ secrets.CYCLEQUANT_WRITE_TOKEN }}
      ALPACA_API_KEY_ID: ${{ secrets.CYCLEQUANT_ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.CYCLEQUANT_ALPACA_API_SECRET_KEY }}
      GEMINI_API_KEY: ${{ secrets.CYCLEQUANT_GEMINI_API_KEY }}

    steps:
      - name: Check cloud configuration
        shell: bash
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_PUBLISHABLE_KEY" || -z "$CYCLEQUANT_WRITE_TOKEN" ]]; then
            echo "Required CycleQuant database configuration is missing." >&2
            exit 1
          fi
          if [[ "$CQ_BROKER_MODE" != "alpaca-paper" || "$CQ_TRADING_ENABLED" != "true" ]]; then
            echo "CycleQuant paper execution is not enabled." >&2
            exit 1
          fi
          if [[ -z "$ALPACA_API_KEY_ID" || -z "$ALPACA_API_SECRET_KEY" ]]; then
            echo "Alpaca paper credentials are missing." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/cic-002-cyclequant/requirements.txt

      - name: Install CycleQuant
        working-directory: projects/cic-002-cyclequant
        run: python -m pip install --disable-pip-version-check .

      - name: Run CycleQuant
        working-directory: projects/cic-002-cyclequant
        shell: bash
        run: |
          retry() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              if [[ "$attempt" == 3 ]]; then return 1; fi
              sleep $((attempt * 15))
            done
          }
          case "$CQ_RUN_MODE" in
            daily)
              retry cyclequant daily
              retry cyclequant sync-broker
              cyclequant health --require-today
              ;;
            sync-broker)
              retry cyclequant sync-broker
              cyclequant health
              ;;
            *)
              echo "Unsupported CycleQuant run mode: $CQ_RUN_MODE" >&2
              exit 2
              ;;
          esac
