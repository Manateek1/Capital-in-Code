<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 408" role="img" aria-labelledby="title desc">
<title id="title">Confirmed yield-curve inversion episodes and NBER recession starts</title>
<desc id="desc">Each row shows a run of three or more months with a monthly mean 10-year minus 3-month spread at or below zero. Solid navy marks the inversion; the dashed gray segment is the 12-month follow-up after the last inverted month; a navy circle marks a covered recession start.</desc>
<rect width="1120" height="408" fill="#FFFFFF"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#101114}.muted{fill:#595D64}.axis{stroke:#8E939B;stroke-width:1}.grid{stroke:#E5E7EB;stroke-width:1}.small{font-size:12px}.label{font-size:13px}.title{font-size:19px;font-weight:600}.subtitle{font-size:12px;fill:#595D64}</style>
<text class="title" x="208" y="31">Inversion episodes and recession starts</text>
<text class="subtitle" x="208" y="53">Primary rule: 3 consecutive monthly means ≤ 0.00 percentage points; follow-up extends 12 months after the last inverted month.</text>
